name: Build & Release Termux Prebuilt Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (leave empty to use package.json)'
        required: false
        default: ''
  push:
    branches:
      - master
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'vendor/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-termux.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Package Termux Prebuilt Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Version
        id: pkg
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Apply Termux Patches
        run: python3 scripts/patch_termux.py --apply || true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Build — Host TypeScript
        env:
          NODE_OPTIONS: "--max-old-space-size=7168"
        run: pnpm run build:lib:host

      - name: Build — Client TypeScript
        env:
          NODE_OPTIONS: "--max-old-space-size=7168"
        run: pnpm run build:lib:client

      - name: Build — Web Frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=7168"
        run: pnpm run build:web

      # ── Package ───────────────────────────────────────────────────────────
      # Strategy: only bundle compiled lib/ dirs + essential config.
      # node_modules are NOT included — Termux already has them as symlinks
      # pointing into ~/deepseek-harness, and `pnpm install --frozen-lockfile`
      # is instant (no downloads) and will re-create any missing symlinks.
      - name: Package Prebuilt lib/ Bundle
        run: |
          set -euo pipefail
          ARCHIVE="dsh-termux-prebuilt-v${VERSION}.tar.gz"
          echo "ARCHIVE_NAME=$ARCHIVE" >> $GITHUB_ENV

          echo "=== Collecting compiled lib/ dirs ==="
          # Find every compiled lib/ directory across the workspace
          # (excludes anything inside node_modules to avoid recursion)
          LIB_DIRS=$(find apps packages vendor \
            -type d -name 'lib' \
            ! -path '*/node_modules/*' \
            ! -path '*/.git/*' \
            2>/dev/null | sort)

          echo "Found lib/ directories:"
          echo "$LIB_DIRS" | head -40

          # The browser bundle is the one build output that is not a lib/ dir.
          # Without it the phone serves a stale client against the new server,
          # which breaks screens like Settings.
          test -d apps/web/dist || { echo "::error::apps/web/dist missing — did build:web run?"; exit 1; }
          echo "Browser bundle: apps/web/dist ($(du -sh apps/web/dist | cut -f1))"

          # Build the tar: lib/ dirs + browser bundle + root config files
          # (no node_modules, no .git)
          tar -czf "$ARCHIVE" \
            --exclude='*.ts' \
            --exclude='*.tsx' \
            --exclude='*.map' \
            $LIB_DIRS \
            apps/web/dist \
            package.json \
            pnpm-workspace.yaml \
            pnpm-lock.yaml \
            .npmrc

          echo ""
          echo "Archive: $ARCHIVE  ($(du -sh "$ARCHIVE" | cut -f1))"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-termux-prebuilt-v${{ env.VERSION }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ARCHIVE_NAME" \
            --title "DeepSeek Harness v${VERSION} — Termux Prebuilt" \
            --notes "## Termux Prebuilt — v${VERSION}

          Pre-compiled \`lib/\` outputs for every workspace package. Built on GitHub Actions — no local \`tsc\` needed on Termux.

          ### Apply on Termux
          \`\`\`bash
          bash ~/deepseek-harness/scripts/install-prebuilt.sh
          dsh-web
          \`\`\`

          > Built from commit: \`${{ github.sha }}\`" \
            --target "${{ github.sha }}"
