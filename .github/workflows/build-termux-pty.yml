# Trigger registration: see FORK.md for the upstream sync procedure.
name: node-pty prebuild (Termux, all Android ABIs)

# The Termux prebuilt-bundle workflow only ships compiled lib/ TypeScript, so a
# `pnpm install` on the phone leaves node-pty with no Android binary and dsh
# dies at plugin load with:
#   Failed to load native module: pty.node, checked: build/Release, build/Debug,
#   prebuilds/android-<arch>
# node-pty resolves `prebuilds/${process.platform}-${process.arch}`, so every
# Android arch that can run Termux needs its own artifact. This workflow builds
# arm64-v8a, armeabi-v7a, and x86_64 against bionic, and load-tests arm64 in a
# real Termux userland.

on:
  workflow_dispatch:
    inputs:
      node_pty_version:
        description: node-pty version from npm to compile
        required: false
        default: 1.2.0-beta.15
      node_target:
        description: Node.js version whose headers to build against
        required: false
        default: 24.18.0
  push:
    branches:
      - master
      - 'termux/**'
    paths:
      - '.github/workflows/build-termux-pty.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_PTY_VERSION: ${{ inputs.node_pty_version || '1.2.0-beta.15' }}
  NODE_TARGET: ${{ inputs.node_target || '24.18.0' }}
  ANDROID_API: '24'

jobs:
  ndk:
    name: NDK cross-compile (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # node_arch is the value Node reports as process.arch on the device;
          # prebuild_dir is the directory node-pty searches.
          - abi: arm64-v8a
            node_arch: arm64
            clang_triple: aarch64-linux-android
            node_gyp_arch: arm64
            elf_class: "ELF64"
            elf_machine: AArch64
          - abi: armeabi-v7a
            node_arch: arm
            clang_triple: armv7a-linux-androideabi
            node_gyp_arch: arm
            elf_class: "ELF32"
            elf_machine: ARM
          - abi: x86_64
            node_arch: x64
            clang_triple: x86_64-linux-android
            node_gyp_arch: x64
            elf_class: "ELF64"
            elf_machine: X86-64
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack node-pty from npm
        run: |
          set -euxo pipefail
          mkdir -p work && cd work
          npm pack "node-pty@${NODE_PTY_VERSION}"
          tar -xzf node-pty-*.tgz
          cd package
          npm install --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Compile pty.node
        working-directory: work/package
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          [ -n "$NDK" ] && [ -d "$NDK" ] || { echo "::error::Android NDK not found on runner"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TC/${{ matrix.clang_triple }}${ANDROID_API}-clang"
          export CXX="$TC/${{ matrix.clang_triple }}${ANDROID_API}-clang++"
          export LINK="$CXX"
          export AR="$TC/llvm-ar" NM="$TC/llvm-nm" RANLIB="$TC/llvm-ranlib" STRIP="$TC/llvm-strip"
          # bionic keeps forkpty()/openpty() in libc and ships no libutil. Termux
          # satisfies binding.gyp's -lutil with an "INPUT(-lc)" linker script; an
          # empty archive is enough to make the flag resolve against the NDK sysroot.
          mkdir -p stub && "$AR" crs stub/libutil.a
          export LDFLAGS="-L$PWD/stub"
          npx --yes node-gyp@11 rebuild --arch=${{ matrix.node_gyp_arch }} --target="$NODE_TARGET" --verbose
          test -f build/Release/pty.node

      - name: Verify ELF targets bionic/${{ matrix.abi }}
        working-directory: work/package
        run: |
          set -euo pipefail
          file build/Release/pty.node
          readelf -h build/Release/pty.node | grep -E 'Class|Machine|Type'
          readelf -d build/Release/pty.node | grep -E 'NEEDED|SONAME' || true
          # The previous version of this step only printed Class and Machine, so
          # a wrong-architecture binary passed and was published under a correct
          # directory name. Assert both fields for the matrix entry.
          CLASS=$(readelf -h build/Release/pty.node | awk -F: '/Class:/{gsub(/ /,"",$2); print $2}')
          MACHINE=$(readelf -h build/Release/pty.node | awk -F: '/Machine:/{gsub(/^ +| +$/,"",$2); print $2}')
          [ "$CLASS" = "${{ matrix.elf_class }}" ] || {
            echo "::error::ELF class $CLASS, expected ${{ matrix.elf_class }} for ${{ matrix.abi }}"; exit 1; }
          case "$MACHINE" in
            *"${{ matrix.elf_machine }}"*) ;;
            *) echo "::error::ELF machine '$MACHINE', expected ${{ matrix.elf_machine }} for ${{ matrix.abi }}"; exit 1 ;;
          esac
          if readelf -W --dyn-syms build/Release/pty.node | grep -q 'GLIBC_'; then
            echo "::error::binary imports glibc symbols; it cannot load under bionic"
            exit 1
          fi

      - name: Stage artifact
        run: |
          set -euo pipefail
          DIR="android-${{ matrix.node_arch }}"
          mkdir -p "out/prebuilds/$DIR"
          cp work/package/build/Release/pty.node "out/prebuilds/$DIR/pty.node"
          cd out && sha256sum "prebuilds/$DIR/pty.node" | tee pty.node.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pty-android-${{ matrix.node_arch }}-ndk
          path: out
          retention-days: 90
          if-no-files-found: error

  termux:
    name: Termux aarch64 build + load test
    runs-on: ubuntu-24.04-arm
    needs: [ndk]
    # Only arm64 has a Termux docker image to load-test in. arm and x64 ship on
    # the NDK build plus the ELF assertion above.
    # Runs after the matrix legs; it loads the arm64 NDK artifact by name.
    if: ${{ !cancelled() }}
    # A cross-check, not a gate: the NDK binary still publishes if this fails.
    continue-on-error: true
    steps:
      - name: Fetch the NDK build for cross-checking
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pty-android-arm64-ndk
          path: ndk

      - name: Build and load-test inside termux/termux-docker:aarch64
        run: |
          set -euxo pipefail
          mkdir -p out ndk ctr
          chmod 777 out
          # The image entrypoint rebuilds the environment from scratch, so
          # `docker run -e VAR` never reaches the script — bake the values in.
          cat > ctr/build.sh <<EOP
          export NODE_PTY_VERSION='${NODE_PTY_VERSION}'
          export NODE_TARGET='${NODE_TARGET}'
          EOP
          cat >> ctr/build.sh <<'EOS'
          set -euxo pipefail
          export PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"
          export HOME="${HOME:-/data/data/com.termux/files/home}"
          export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
          export PATH="$PREFIX/bin:$PATH"
          mkdir -p "$TMPDIR"

          for i in 1 2 3; do apt update -y && break; sleep 5; done
          apt install -yq nodejs python clang make binutils
          node -v && python3 -V && uname -m

          rm -rf "$HOME/work" && mkdir -p "$HOME/work" && cd "$HOME/work"
          npm pack "node-pty@${NODE_PTY_VERSION}"
          tar -xzf node-pty-*.tgz
          cd package
          npm install --ignore-scripts --omit=dev --no-audit --no-fund
          npx --yes node-gyp@11 rebuild --target="${NODE_TARGET}" --verbose
          test -f build/Release/pty.node
          mkdir -p prebuilds/android-arm64

          # Load + fork a real pty, in a real Termux userland on real aarch64.
          test_binary() {
            cp -f "$1" prebuilds/android-arm64/pty.node
            node -e 'const m = require("./prebuilds/android-arm64/pty.node"); console.log("[load ok]", Object.keys(m).sort().join(","));'
            node -e 'const pty = require("./lib/index.js");
              const t = pty.spawn("sh", ["-c", "echo PTY_OK"], { cols: 80, rows: 24 });
              let out = "";
              t.onData(d => { out += d; });
              t.onExit(({ exitCode }) => {
                console.log("[spawn]", JSON.stringify(out), "exit", exitCode);
                process.exit(out.includes("PTY_OK") ? 0 : 1);
              });
              setTimeout(() => { console.log("[spawn] timed out"); process.exit(1); }, 15000);'
            echo "[verified] $2"
          }

          test_binary build/Release/pty.node termux-native
          cp -f build/Release/pty.node /out/pty.node.termux

          if [ -f /ndk/prebuilds/android-arm64/pty.node ]; then
            if test_binary /ndk/prebuilds/android-arm64/pty.node ndk-cross; then
              cp -f /ndk/prebuilds/android-arm64/pty.node /out/pty.node.ndk-verified
            else
              echo "::warning::the NDK cross-compiled binary failed the Termux load test"
            fi
          fi
          EOS
          chmod 755 ctr/build.sh
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$PWD/ctr:/ctr:ro" -v "$PWD/ndk:/ndk:ro" -v "$PWD/out:/out" \
            termux/termux-docker:aarch64 bash /ctr/build.sh

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p final/prebuilds/android-arm64
          cp out/pty.node.termux final/prebuilds/android-arm64/pty.node
          cd final && sha256sum prebuilds/android-arm64/pty.node | tee pty.node.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pty-android-arm64-termux
          path: final
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Publish the verified prebuild
    runs-on: ubuntu-latest
    needs: [ndk, termux]
    if: ${{ !cancelled() }}
    steps:
      - name: Collect build outputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: pty-android-*
          path: dl

      - name: Pick the best binary and write a manifest
        run: |
          set -euo pipefail
          set +e
          PRODUCED=0
          # One artifact per ABI; the arm64 one may also carry the Termux-tested
          # build, which is preferred over the NDK cross-compile.
          for ARCH in arm64 arm x64; do
            DIR="android-$ARCH"
            T="dl/pty-$DIR-termux/prebuilds/$DIR/pty.node"
            N="dl/pty-$DIR-ndk/prebuilds/$DIR/pty.node"
            if [ -f "$T" ]; then
              SRC="$T"; ORIGIN=termux-docker-native
            elif [ -f "$N" ]; then
              SRC="$N"; ORIGIN=android-ndk-cross-compile
            else
              echo "::warning::no artifact for $DIR; that device arch will have no prebuilt pty"
              continue
            fi
            mkdir -p "out/prebuilds/$DIR"
            cp "$SRC" "out/prebuilds/$DIR/pty.node"
            SHA=$(sha256sum "out/prebuilds/$DIR/pty.node" | cut -d' ' -f1)
            echo "$SHA  prebuilds/$DIR/pty.node" >> out/pty.node.sha256
            cat > "out/manifest-$DIR.json" <<JSON
          {
            "platform": "$DIR",
            "node_arch": "$ARCH",
            "node_pty_version": "${NODE_PTY_VERSION}",
            "node_target": "${NODE_TARGET}",
            "min_android_api": ${ANDROID_API},
            "built_by": "${ORIGIN}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "sha256": "${SHA}"
          }
          JSON
            PRODUCED=$((PRODUCED+1))
          done
          [ "$PRODUCED" -gt 0 ] || { echo "::error::no build job produced a pty.node"; exit 1; }
          # Keep manifest.json for arm64 so existing installers keep working.
          [ -f out/manifest-android-arm64.json ] && cp out/manifest-android-arm64.json out/manifest.json
          true
          {
            echo "### node-pty prebuild — all Android ABIs"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| node-pty | \`${NODE_PTY_VERSION}\` |"
            echo "| built by | \`${ORIGIN}\` |"
            echo "| sha256 | \`${SHA}\` |"
            echo
            echo "Install on the phone:"
            echo
            echo '```bash'
            echo "bash ~/deepseek-harness/scripts/install-pty-prebuild.sh --run-id ${GITHUB_RUN_ID}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pty-android-all
          path: out
          retention-days: 90
          if-no-files-found: error
